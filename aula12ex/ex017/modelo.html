<body>
    <header><h1>Verificador de idade</h1></header>

        <label for="iano">Data de nascimento:</label>

    </div>
    <div>
        <p id="sexo">Sexo:</p>

        <input type="radio" name="sexo" id="isexf" class="sexo">
        <label for="isexf">Feminino</label><br>
        <input type="button" value="Verificar" onclick="verificar()">
        <p id="resultado">Preencher as informações acima para ver o resultado!</p>
    </div>
    </section>
    <footer>
        <p>&copy; Curso em video</p>
    </footer>
