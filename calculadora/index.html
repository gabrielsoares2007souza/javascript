<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <main id="conteiner">
        <div id="calculadora">
            <div id="answer">
                0
            </div>
            <div class="btn-calculadora-rows">
                <button class="btn-numbers">
                    7
                </button>
                <button class="btn-numbers">
                    8
                </button>
                <button class="btn-numbers">
                    9
                </button>
                <button class="btn-numbers special">
                    &divide;
                </button>
            </div>
            <div class="btn-calculadora-rows">
                <button class="btn-numbers">
                    4
                </button>
                <button class="btn-numbers">
                    5
                </button>
                <button class="btn-numbers">
                    6
                </button>
                <button class="btn-numbers special">
                    &times;
                </button>
            </div>
            <div class="btn-calculadora-rows">
                <button class="btn-numbers">
                    1
                </button>
                <button class="btn-numbers">
                    2
                </button>
                <button class="btn-numbers">
                    3
                </button>
                <button class="btn-numbers special">
                    &minus;
                </button>
            <div>
            <div class="btn-calculadora-rows">
                <button class="btn-numbers">
                    0
                </button>
                <button class="btn-numbers">
                    ,
                </button>
                <button class="btn-numbers signal-equals">
                    &equals;
                </button>
                <button class="btn-numbers special">
                    &plus;
                </button>
            </div>
        </div>

    </main>


    <script src="scripts/script.js"></script>
</body>
</html>
