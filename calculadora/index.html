<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <main id="bloco-calculadora">
        <div class="resultado">
            0
        </div>
       <div class="btn-calculadora-row">
           <button class="btn-number">
               7
            </button>
           <button class="btn-number">
               8
            </button>
           <button class="btn-number">
               9
            </button>
           <button class="btn-number column" >
               &divide;
            </button>
       </div>

       <div class="btn-calculadora-row">
        <button class="btn-number">
            4
        </button>
        <button class="btn-number">
            5
        </button>
        <button class="btn-number">
            6
        </button>
        <button class="btn-number column" >
            &times;
        </button>
       </div>

       <div class="btn-calculadora-row">
        <button class="btn-number">
            1
        </button>
        <button class="btn-number">
            2
        </button>
        <button class="btn-number">
            3
        </button>
        <button class="btn-number column" >
            &minus;
        </button>
       </div>

       <div class="btn-calculadora-row">
        <button class="btn-number double">
            0
        </button>
        <button class="btn-number equals">
            &equals;
        </button>
        <button class="btn-number column" >
            &plus;
        </button>
       </div>
       <button class="limpar">
        limpar
       </button>
    </main>


    <scrpit src="scripts/script.js">

    </scrpit>
</body>
</html>
