<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    <div class="conteiner">
        <div id="valor1" class="valores">
            <label for="iv1">Valor 1 :</label>
            <input type="text" name="v1" id="iv1" autocomplete="off">
        </div>
        <div id="valor2" class="valores">
            <label for="iv2">Valor 2 :</label>
            <input type="text" name="v2" id="iv2" autocomplete="off">
        </div>
        <div class="buttons">
            <button id="btn_plus" class="btn">
                &plus;
            </button>
            <button id="btn_minus" class="btn">
                &minus;
            </button>
            <button id="btn_divide" class="btn">
                &divide;
            </button>
            <button id="btn_times" class="btn">
                &times;
            </button>
        </div>
        <div class="valores" id="answer">

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
